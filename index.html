<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeistDesk - Sovereign Helpdesk Engine</title>
    <script>
      // Workaround for "Uncaught TypeError: Cannot redefine property: ethereum"
      // This error often occurs in iframe environments when browser extensions (like MetaMask)
      // try to inject multiple times or conflict with the sandbox.
      (function() {
        const originalDefineProperty = Object.defineProperty;
        Object.defineProperty = function(obj, prop, descriptor) {
          if (prop === 'ethereum' && obj === window) {
            try {
              return originalDefineProperty.apply(this, arguments);
            } catch (e) {
              console.warn('Prevented ethereum redefinition error');
              return obj;
            }
          }
          return originalDefineProperty.apply(this, arguments);
        };
      })();

      // Resilient safe-storage abstraction to avoid standard SecurityError in sandboxed iframes
      (function() {
        let originalStorage = null;
        let useFallback = false;
        try {
          if (window.localStorage) {
            window.localStorage.getItem('__test_storage_integrity__');
            originalStorage = window.localStorage;
          } else {
            useFallback = true;
          }
        } catch (e) {
          useFallback = true;
        }

        let storageMock = null;
        const memoryDatabase = {};

        const memoryStorage = {
          getItem: function(key) {
            return Object.prototype.hasOwnProperty.call(memoryDatabase, key) ? memoryDatabase[key] : null;
          },
          setItem: function(key, val) {
            memoryDatabase[key] = String(val);
          },
          removeItem: function(key) {
            delete memoryDatabase[key];
          },
          clear: function() {
            for (const k in memoryDatabase) {
              delete memoryDatabase[k];
            }
          },
          key: function(idx) {
            return Object.keys(memoryDatabase)[idx] || null;
          },
          get length() {
            return Object.keys(memoryDatabase).length;
          }
        };

        try {
          Object.defineProperty(window, 'localStorage', {
            get: function() {
              if (useFallback) {
                return storageMock || memoryStorage;
              }
              return storageMock || originalStorage || memoryStorage;
            },
            set: function(val) {
              console.warn('Intercepted window.localStorage setter. Assigned safely.');
              storageMock = val;
            },
            configurable: true,
            enumerable: true
          });
          window.safeLocalStorage = window.localStorage;
        } catch (e) {
          console.warn('Could not defineProperty localStorage on window directly. Redefining on Window.prototype if possible...', e);
          try {
            Object.defineProperty(Window.prototype, 'localStorage', {
              get: function() {
                if (useFallback) return storageMock || memoryStorage;
                return storageMock || originalStorage || memoryStorage;
              },
              set: function(val) {
                storageMock = val;
              },
              configurable: true,
              enumerable: true
            });
            window.safeLocalStorage = window.localStorage;
          } catch (protoErr) {
            console.error('Failed to redefine localStorage:', protoErr);
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
