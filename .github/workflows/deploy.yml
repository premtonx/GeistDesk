name: Secure Production Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Baseline
        uses: actions/checkout@v4

      - name: Execute Remote SSH Deployment Loop
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: sovereign
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ~/GeistDesk
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build
            # Give Postgres + the gateway a moment to become ready, then seed.
            # Idempotent upsert: safe to run on every deploy.
            sleep 15
            docker compose exec -T geistdesk-gateway node dist/seed.cjs
