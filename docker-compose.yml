# GeistDesk production / pilot compose.
# Compatible with CI deploy that syncs prebuilt dist/ and runs:
#   docker compose build --build-arg BUILD_ID=... geistdesk-gateway
#   docker compose up -d geistdesk-gateway
#
# Boot (scripts/docker-entrypoint.sh):
#   wait for Postgres → db:deploy:prod → seed:prod → server

services:
  geistdesk-gateway:
    build:
      context: .
      args:
        BUILD_ID: ${BUILD_ID:-local}
    container_name: geistdesk-sovereign-gate
    depends_on:
      - geistdesk-db
    environment:
      - NODE_ENV=production
      - PORT=3000
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-https://app.premtonx.cloud}

      # Database — default matches bundled geistdesk-db credentials below.
      # Override DATABASE_URL in .env for managed Postgres.
      - DATABASE_URL=${DATABASE_URL:-postgresql://geist_user:geist_password@geistdesk-db:5432/geistdesk_prod?sslmode=disable}
      - DATABASE_SSL_INSECURE=${DATABASE_SSL_INSECURE:-false}

      # Required security secrets (must exist in host .env — deploy script enforces JWT/VAULT)
      - JWT_SECRET=${JWT_SECRET}
      - VAULT_ENCRYPTION_KEY=${VAULT_ENCRYPTION_KEY}
      - MASTER_KEY_SALT=${MASTER_KEY_SALT:-}
      - AI_SECRETS_KEY=${AI_SECRETS_KEY:-}
      - MICROSOFT_PROVIDER_CLIENT_ID=${MICROSOFT_PROVIDER_CLIENT_ID:-}

      # Security hardening
      - BETA_AUTO_ADMIN=${BETA_AUTO_ADMIN:-false}
      - ALLOW_PUBLIC_REGISTRATION=${ALLOW_PUBLIC_REGISTRATION:-false}
      - ENABLE_SANDBOX=${ENABLE_SANDBOX:-false}
      - VITE_DEMO_MODE=${VITE_DEMO_MODE:-false}
      - GRAPH_CLIENT_STATE_SECRET=${GRAPH_CLIENT_STATE_SECRET:-}
      - INBOUND_MAIL_WEBHOOK_SECRET=${INBOUND_MAIL_WEBHOOK_SECRET:-}
      - INBOUND_MAIL_FORWARD_DOMAIN=${INBOUND_MAIL_FORWARD_DOMAIN:-app.premtonx.cloud}
      - EMAIL_INGESTION_INTERVAL_MS=${EMAIL_INGESTION_INTERVAL_MS:-60000}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}

      # Outbound mail (optional)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_USER=${SMTP_USER:-}
      - MAIL_DISPATCH_URL=${MAIL_DISPATCH_URL:-}

      # LLM
      - OLLAMA_ENDPOINT=${OLLAMA_ENDPOINT:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_DEPLOYMENT_NAME=${AZURE_OPENAI_DEPLOYMENT_NAME:-}
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT:-}

      # OIDC / SSO
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET:-}
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI:-}

      # Firebase / client (legacy compose passthrough)
      - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY:-}
      - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN:-}
      - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID:-}
      - VITE_AI_PROVIDER=${VITE_AI_PROVIDER:-azure}

      # Teams Bot
      - MicrosoftAppId=${MicrosoftAppId:-}
      - MicrosoftAppPassword=${MicrosoftAppPassword:-}
      - MicrosoftAppType=${MicrosoftAppType:-}
      - MicrosoftAppTenantId=${MicrosoftAppTenantId:-}
    restart: always
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.geistdesk-sso.rule=Host(`app.premtonx.cloud`)"
      - "traefik.http.routers.geistdesk-sso.entrypoints=websecure"
      - "traefik.http.routers.geistdesk-sso.tls.certresolver=myresolver"
      - "traefik.http.services.geistdesk-sso.loadbalancer.server.port=3000"

  geistdesk-db:
    image: postgres:15-alpine
    container_name: geistdesk-db-container
    environment:
      # Defaults preserve existing production volumes created with geist_user/geist_password.
      # Override via .env only when provisioning a NEW empty volume.
      - POSTGRES_USER=${POSTGRES_USER:-geist_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-geist_password}
      - POSTGRES_DB=${POSTGRES_DB:-geistdesk_prod}
    volumes:
      - geistdesk_db_data:/var/lib/postgresql/data
    restart: always
    networks:
      - traefik-public

volumes:
  geistdesk_db_data:

networks:
  traefik-public:
    external: true
