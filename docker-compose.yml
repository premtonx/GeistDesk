# GeistDesk production / self-host compose.
# All host-specific values come from `.env` (see `.env.example` or `./setup.sh`).
# No container_name pins — Docker namespaces containers from the project folder.
# Gateway image is multi-stage (Dockerfile): clean clones do not need host dist/.
#
# Boot (scripts/docker-entrypoint.sh):
#   wait for Postgres → db:deploy:prod → seed:prod → server

services:
  geistdesk-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_ID: ${BUILD_ID:-local}
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
        VITE_ENABLE_DEMO_LOGIN: ${VITE_ENABLE_DEMO_LOGIN:-false}
        VITE_BETA_AUTO_ADMIN: ${VITE_BETA_AUTO_ADMIN:-false}
        VITE_OLLAMA_ENDPOINT: ${VITE_OLLAMA_ENDPOINT:-}
        VITE_MASTER_KEY_SALT: ${VITE_MASTER_KEY_SALT:-}
        VITE_PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
    depends_on:
      geistdesk-db:
        condition: service_healthy
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-http://localhost:3000}

      # Bundled Postgres URL. Prefer GEISTDESK_DATABASE_URL from `.env` (setup.sh
      # writes it to match POSTGRES_*). Nested defaults keep greenfield boots working
      # without sed. Existing volumes that used geist_password stay compatible.
      - DATABASE_URL=${GEISTDESK_DATABASE_URL:-postgresql://${POSTGRES_USER:-geist_user}:${POSTGRES_PASSWORD:-geist_password}@geistdesk-db:5432/${POSTGRES_DB:-geistdesk_prod}?sslmode=disable}
      - DATABASE_SSL_INSECURE=${DATABASE_SSL_INSECURE:-false}

      - JWT_SECRET=${JWT_SECRET}
      - VAULT_ENCRYPTION_KEY=${VAULT_ENCRYPTION_KEY}
      - MASTER_KEY_SALT=${MASTER_KEY_SALT:-}
      - AI_SECRETS_KEY=${AI_SECRETS_KEY:-}
      - MICROSOFT_PROVIDER_CLIENT_ID=${MICROSOFT_PROVIDER_CLIENT_ID:-}

      - BETA_AUTO_ADMIN=${BETA_AUTO_ADMIN:-false}
      - ALLOW_PUBLIC_REGISTRATION=${ALLOW_PUBLIC_REGISTRATION:-false}
      - ENABLE_SANDBOX=${ENABLE_SANDBOX:-false}
      - VITE_DEMO_MODE=${VITE_DEMO_MODE:-false}
      - ENABLE_DEMO_LOGIN=${ENABLE_DEMO_LOGIN:-false}
      - VITE_ENABLE_DEMO_LOGIN=${VITE_ENABLE_DEMO_LOGIN:-false}
      - GRAPH_CLIENT_STATE_SECRET=${GRAPH_CLIENT_STATE_SECRET:-}
      - INBOUND_MAIL_WEBHOOK_SECRET=${INBOUND_MAIL_WEBHOOK_SECRET:-}
      - INBOUND_EMAIL_DOMAIN=${INBOUND_EMAIL_DOMAIN:-}
      - INBOUND_MAIL_FORWARD_DOMAIN=${INBOUND_MAIL_FORWARD_DOMAIN:-${DOMAIN_NAME:-localhost}}
      - EMAIL_INGESTION_INTERVAL_MS=${EMAIL_INGESTION_INTERVAL_MS:-60000}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}

      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_USER=${SMTP_USER:-}
      - MAIL_DISPATCH_URL=${MAIL_DISPATCH_URL:-}

      - OLLAMA_ENDPOINT=${OLLAMA_ENDPOINT:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-}
      - AZURE_OPENAI_EMBEDDING_DEPLOYMENT=${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_DEPLOYMENT_NAME=${AZURE_OPENAI_DEPLOYMENT_NAME:-}
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT:-}

      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET:-}
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI:-}

      - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY:-}
      - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN:-}
      - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID:-}
      - VITE_AI_PROVIDER=${VITE_AI_PROVIDER:-azure}
      - VITE_MASTER_KEY_SALT=${VITE_MASTER_KEY_SALT:-}

      - MicrosoftAppId=${MicrosoftAppId:-}
      - MicrosoftAppPassword=${MicrosoftAppPassword:-}
      - MicrosoftAppType=${MicrosoftAppType:-}
      - MicrosoftAppTenantId=${MicrosoftAppTenantId:-}
    restart: always
    networks:
      - geistdesk-internal
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik-public}"
      - "traefik.http.routers.${ROUTER_NAME:-geistdesk}.rule=Host(`${DOMAIN_NAME:-localhost}`)"
      - "traefik.http.routers.${ROUTER_NAME:-geistdesk}.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.${ROUTER_NAME:-geistdesk}.tls.certresolver=${TRAEFIK_CERTRESOLVER:-myresolver}"
      - "traefik.http.services.${ROUTER_NAME:-geistdesk}.loadbalancer.server.port=3000"

  geistdesk-db:
    image: pgvector/pgvector:pg15
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-geist_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-geist_password}
      - POSTGRES_DB=${POSTGRES_DB:-geistdesk_prod}
    volumes:
      - geistdesk_db_data:/var/lib/postgresql/data
    restart: always
    networks:
      - geistdesk-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  geistdesk_db_data:

networks:
  geistdesk-internal:
    driver: bridge
  traefik:
    name: ${TRAEFIK_NETWORK:-traefik-public}
    external: true
